<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Table rowspan example</h2>

    <table border="1">
        <thead>
            <tr>
                <th>language</th>
                <th>details</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3">web design</td>
                <td>html</td>
            </tr>
            <tr>
                <td>css</td>
            </tr>
            <tr>
                <td>javascript</td>
            </tr>


        </tbody>
    </table>


    <hr>

    <h2>Table colspan example</h2>

    <table border="1">
        <thead>
           
       
        <tbody>
            <tr>
                <th colspan="4">web design</th>
                <th colspan="5">graphic design</th>
                </tr>
            <tr>
                <td>html</td>
                <td>css</td>
                <td>bootstrap</td>
                <td>js</td>
                <td>react</td>
    
                <td>canva</td>
                <td>figma</td>
                <td>adobe</td>
                <td>com..</td>
                <td>express</td>
            </tr>
        </tbody>
</body>
</html>
