<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Input Types Example </h2>
    <form>
        <label>enter name</label>
        <input type="text" placeholder="enter name"/>

        <label>enter email</label>
        <input type="email" placeholder="enter email"/>
        <br><br>

        <label>aadhar number</label>
        <input type="aadhar number" placeholder="aadhar number"/>

        <label>enter password</label>
        <input type="enter password" placeholder="enter password"/>
        <br><br>

        <label>Enter DOB</label>
        <input type="date"/>

        <label>Enter Month</label>
        <input type="month"/>
        <br><br>
        
        <label>enter week</label>
        <input type="week"/>

        <label>enter time</label>
        <input type="time"/>
        <br><br>

        <label>enter date and time</label>
        <input type="datetime-local"/>
        <br><br>

        <label>choose cities</label>
        <input type="checkbox" checked/>mumbai
        <input type="checkbox" checked/>delhi
        <input type="checkbox"/>chennai
        <input type="checkbox"/>bangaluru
        <br><br>

        <label>select gender</label>
        <input type="radio" name="gender"/>male
        <input type="radio" name="gender">female
        <input type="radio" name="gender">other
        <br>

        <label>select color</label>
        <input type="color"/>
        <br><br>

        <label>select range</label>
        <input type="range"/>
        <br><br>

        <label>upload docs</label>
        <input type="file" multiple/>
        <br><br>
        <label>search</label>
        <input type="search" placeholder="type here to search"/>
        <br><br>

        <label>enter url</label>
        <input type="url"placeholder="">
        <br><br>

        <label>enter telephone</label>
        <input type="tel"placeholder="354568767"/>

        <br><br>
        <label>select city</label>
        <select>
            <option>choose your city </option>
            <option>nashik</option>
            <option>nashik</option>
            <option>nashik</option>
            <option>nashik</option>

        </select>
        <label>enter address</label>
        <textarea rows="5" cols="30"></textarea>
        <br><br>

        <input type="submit" value="submit form">
        <input type="button"value="submit form">
        <input type="" value="submit form"/>


    </form>
</body>
</html>
