<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <marquee direction="right" behavior="alternate" bgcolor="yellow">
        <h1>Hello, World!</h1>
    </marquee>

    <marquee direction="up" behavior="alternate" bgcolor="yellow" height="400px">
        <h1>Hello, World!</h1>
    </marquee>

    <marquee direction="right" scrolldelay="100" behavior="alternate" bgcolor="yellow">
        <h1>Hello, World!</h1>
    </marquee>

    <marquee direction="right" scrollamount="40" behavior="alternate" bgcolor="yellow">
        <h1>Hello, World!</h1>
    </marquee>
</body>
</html>
